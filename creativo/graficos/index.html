<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WirallesTEC · Bucaramanga: el caso para reabrir</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      background: #F8F9FA;
      color: #1A1A2E;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      height: 52px;
      background: #FFFFFF;
      border-bottom: 1px solid #E8ECEF;
      flex-shrink: 0;
    }
    .header-tag {
      color: #95A5A6;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .header-sep { color: #E8ECEF; }
    .header-title {
      font-size: 13px;
      font-weight: 700;
      color: #1A1A2E;
    }
    .header-title span { color: #C0392B; }
    .header-spacer { flex: 1; }
    .nav-arrows { display: flex; gap: 6px; }
    .nav-arrows button {
      background: #F8F9FA;
      border: 1px solid #E8ECEF;
      border-radius: 4px;
      padding: 4px 10px;
      font-family: inherit;
      font-size: 13px;
      color: #95A5A6;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .nav-arrows button:hover { background: #E8ECEF; color: #1A1A2E; }
    .slide-counter {
      font-size: 11px;
      color: #95A5A6;
      min-width: 50px;
      text-align: center;
    }

    /* ── LAYOUT ── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 248px;
      flex-shrink: 0;
      background: #FFFFFF;
      border-right: 1px solid #E8ECEF;
      overflow-y: auto;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .sidebar-label {
      font-size: 10px;
      letter-spacing: 2px;
      color: #BDC3C7;
      text-transform: uppercase;
      padding: 2px 8px 10px;
    }
    .slide-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 10px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: none;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      font-size: 12px;
      color: #1A1A2E;
      transition: background 0.12s, border-color 0.12s;
    }
    .slide-btn:hover {
      background: #F8F9FA;
      border-color: #E8ECEF;
    }
    .slide-btn.active {
      background: #F0FAF8;
      border-color: #16A085;
      color: #16A085;
    }
    .slide-btn.active .num {
      background: #16A085;
      color: #FFFFFF;
      border-color: #16A085;
    }
    .num {
      flex-shrink: 0;
      min-width: 26px;
      height: 22px;
      background: #F8F9FA;
      border: 1px solid #E8ECEF;
      border-radius: 4px;
      font-size: 10px;
      color: #95A5A6;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .label { line-height: 1.3; }

    /* ── VIEWER ── */
    .viewer {
      flex: 1;
      overflow: hidden;
      background: #F8F9FA;
    }
    .viewer iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <header class="header">
    <span class="header-tag">WirallesTEC</span>
    <span class="header-sep">·</span>
    <span class="header-title">Bucaramanga: <span>el caso para reabrir</span></span>
    <div class="header-spacer"></div>
    <div class="nav-arrows">
      <button onclick="loadPrev()" title="Slide anterior (←)">&#8592;</button>
      <span class="slide-counter" id="counter">1 / 8</span>
      <button onclick="loadNext()" title="Slide siguiente (→)">&#8594;</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-label">Slides</div>
      <button class="slide-btn" onclick="load(0)" id="btn-0">
        <span class="num">01</span>
        <span class="label">ECG: La línea que se aplana</span>
      </button>
      <button class="slide-btn" onclick="load(1)" id="btn-1">
        <span class="num">02</span>
        <span class="label">Bump chart: El ranking que cuenta la historia</span>
      </button>
      <button class="slide-btn" onclick="load(2)" id="btn-2">
        <span class="num">03</span>
        <span class="label">Timeline anotado: La escena del crimen</span>
      </button>
      <button class="slide-btn" onclick="load(3)" id="btn-3">
        <span class="num">04</span>
        <span class="label">Waffle: El peso real de Bucaramanga</span>
      </button>
      <button class="slide-btn" onclick="load(4)" id="btn-4">
        <span class="num">05</span>
        <span class="label">Quadrant: El veredicto sobre Rafael y Ana</span>
      </button>
      <button class="slide-btn" onclick="load(5)" id="btn-5">
        <span class="num">06</span>
        <span class="label">Radar: Radiografía de 5 dimensiones</span>
      </button>
      <button class="slide-btn" onclick="load(6)" id="btn-6">
        <span class="num">07</span>
        <span class="label">Dumbbell: Pereira vs Bucaramanga</span>
      </button>
      <button class="slide-btn" onclick="load(7)" id="btn-7">
        <span class="num">08</span>
        <span class="label">Reapertura: El plan en 3 fases</span>
      </button>
    </nav>
    <div class="viewer">
      <iframe id="viewer-frame" src="slide1_ecg.html"></iframe>
    </div>
  </div>

  <script>
    const slides = ["slide1_ecg.html", "slide2_bump.html", "slide3_timeline.html", "slide4a_waffle.html", "slide4b_quadrant.html", "slide5_radar.html", "slide6_dumbbell.html", "slide7_matrix.html"];
    let active = 0;

    function load(idx) {
      if (idx < 0 || idx >= slides.length) return;
      active = idx;
      document.getElementById('viewer-frame').src = slides[idx];
      document.querySelectorAll('.slide-btn').forEach((b, i) => {
        b.classList.toggle('active', i === idx);
      });
      document.getElementById('counter').textContent = (idx + 1) + ' / ' + slides.length;
    }

    function loadNext() { load(Math.min(active + 1, slides.length - 1)); }
    function loadPrev() { load(Math.max(active - 1, 0)); }

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') loadNext();
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   loadPrev();
    });

    // Marcar el primer slide como activo al cargar
    document.getElementById('btn-0').classList.add('active');
  </script>

</body>
</html>
